name: Bridge metadata review
on:
  pull_request:
    paths:
      - 'bridge/mint-metadata*'
      - 'bridge/reviewed-origin-mint*'
      - 'bridge/pending-claim*'
      - 'bridge/pending-inventory*'
      - 'bridge/event-inventory*'
      - 'bridge/program-account-collector*'
      - 'bridge/event-collection-comparison*'
      - 'bridge/rehearsal/event-collection.mjs'
      - 'engine/rehearsal/event_collection*'
      - 'evidence/bridge-event-collection-agave.json'
      - 'evidence/bridge-program-account-collector-local.json'
      - 'bridge/EVENT_INVENTORY.md'
      - 'evidence/bridge-returned-event-inventory-local.json'
      - 'bridge/PENDING_INVENTORY.md'
      - 'bridge/rehearsal/selected-inventory.mjs'
      - 'evidence/bridge-selected-pending-inventory-retained.json'
      - 'evidence/bridge-selected-pending-inventory-local.json'
      - 'bridge/pinned-pending*'
      - 'bridge/reviewed-pending*'
      - 'bridge/claim-mint-policy.mjs'
      - 'bridge/claim-pin-policy.mjs'
      - 'bridge/test-fixtures/**'
      - 'bridge/PENDING_CLAIMS.md'
      - 'evidence/bridge-reviewed-journal-local.json'
      - 'evidence/bridge-metadata-journal-agave.json'
      - 'evidence/bridge-metadata-pending-crash-agave.json'
      - 'evidence/bridge-metadata-redemption-crash-agave.json'
      - 'bridge/REVIEWED_ORIGIN_MINT.md'
      - 'bridge/rehearsal/*reviewed-metadata*'
      - 'engine/rehearsal/reviewed_metadata_origin*'
      - 'engine/rehearsal/cold_copy.py'
      - 'bridge/origin-assets*'
      - 'bridge/origin-token-code*'
      - 'bridge/MINT_METADATA.md'
      - 'bridge/ORIGIN_ASSETS.md'
      - 'bridge/rehearsal/metadata-origin.mjs'
      - 'bridge/rehearsal/metadata-journal.mjs'
      - 'engine/rehearsal/metadata_journal*'
      - 'bridge/rehearsal/metadata-pending-crash.mjs'
      - 'engine/rehearsal/metadata_pending_crash*'
      - 'bridge/METADATA_COLD_RESTORE.md'
      - 'bridge/rehearsal/metadata-cold-restore.mjs'
      - 'engine/rehearsal/metadata_cold_restore*'
      - 'evidence/bridge-metadata-cold-restore-agave.json'
      - 'bridge/rehearsal/metadata-redemption-crash.mjs'
      - 'engine/rehearsal/metadata_redemption_crash*'
      - 'bridge/rehearsal/metadata-unsubmitted-expiry.mjs'
      - 'engine/rehearsal/metadata_unsubmitted_expiry*'
      - 'bridge/rehearsal/metadata-redemption-expiry.mjs'
      - 'bridge/rehearsal/metadata-dropped-redemption.mjs'
      - 'bridge/rehearsal/drop-submission*'
      - 'engine/rehearsal/metadata_dropped_redemption*'
      - 'evidence/bridge-metadata-dropped-redemption-agave.json'
      - 'engine/rehearsal/metadata_redemption_expiry*'
      - 'bridge/rehearsal/metadata-origin-code.mjs'
      - 'engine/rehearsal/metadata_origin_code*'
      - 'bridge/upgrade-observation*'
      - 'bridge/observer-reports*'
      - 'bridge/expired-review*'
      - 'bridge/EXPIRED_RECOVERY.md'
      - 'bridge/CONNECTION_LOSS.md'
      - 'bridge/FINALITY_RECOVERY.md'
      - 'bridge/rehearsal/metadata-expiry-review.mjs'
      - 'evidence/bridge-metadata-expiry-review-offline.json'
      - 'evidence/bridge-metadata-origin-code-agave.json'
      - 'evidence/bridge-metadata-redemption-expiry-agave.json'
      - 'evidence/bridge-metadata-unsubmitted-expiry-agave.json'
      - 'engine/rehearsal/cold_copy_test.py'
      - 'engine/rehearsal/metadata_origin*'
      - 'engine/rehearsal/bootstrap.py'
      - 'evidence/bridge-metadata-observer-local.json'
      - 'evidence/bridge-metadata-origin-agave.json'
      - 'evidence/bridge-reviewed-metadata-origin-agave.json'
      - '.github/workflows/bridge-metadata-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
      - run: npm install --global pnpm@10.34.7
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Retained offline runner syntax
        run: |
          node --check bridge/rehearsal/event-collection.mjs
          node --check bridge/rehearsal/selected-inventory.mjs
          node --check bridge/rehearsal/metadata-cold-restore.mjs
      - name: Offline metadata and existing admission regressions
        run: node --test bridge/event-collection-comparison.test.mjs bridge/program-account-collector.test.mjs bridge/event-inventory.test.mjs bridge/pending-inventory.test.mjs bridge/reviewed-pending.test.mjs bridge/pinned-pending.test.mjs bridge/reviewed-origin-mint.test.mjs bridge/mint-metadata.test.mjs bridge/origin-assets.test.mjs bridge/origin-token-code.test.mjs bridge/pending-claim.test.mjs bridge/pending-redemption.test.mjs bridge/pending-large-native.test.mjs bridge/lossless-native-rpc.test.mjs bridge/observer-reports.test.mjs bridge/expired-review.test.mjs bridge/program-pins.test.mjs bridge/upgrade-observation.test.mjs
      - name: Private rehearsal admission guards
        run: python3 engine/rehearsal/metadata_origin_test.py
      - name: Read-only review copy guards
        run: python3 engine/rehearsal/reviewed_metadata_origin_test.py
      - name: Fresh metadata journal worker guards
        run: python3 engine/rehearsal/metadata_journal_test.py
      - name: Metadata pending-fault admission guards
        run: python3 engine/rehearsal/metadata_pending_crash_test.py
      - name: Stopped-ledger copy guards
        run: python3 engine/rehearsal/cold_copy_test.py
      - name: Metadata original-redemption pending-fault guards
        run: python3 engine/rehearsal/metadata_redemption_crash_test.py
      - name: Metadata actual-height unsubmitted-expiry guards
        run: python3 engine/rehearsal/metadata_unsubmitted_expiry_test.py
      - name: Metadata actual-height original-redemption expiry guards
        run: python3 engine/rehearsal/metadata_redemption_expiry_test.py
      - name: Metadata origin-code replacement guards
        run: python3 engine/rehearsal/metadata_origin_code_test.py
      - name: Controlled local submission transport checks
        run: node --test bridge/rehearsal/drop-submission.test.mjs
      - name: Metadata controlled-drop and expiry worker guards
        run: python3 engine/rehearsal/metadata_dropped_redemption_test.py
      - name: Metadata archive restore admission guards
        run: python3 -B -W error::ResourceWarning engine/rehearsal/metadata_cold_restore_test.py
      - name: Read-only current account collection worker guards
        run: python3 -B -W error::ResourceWarning engine/rehearsal/event_collection_test.py
